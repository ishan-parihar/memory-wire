# Publish memory-wire release assets.
#
# Why this exists: install/get-memory-wire.sh advertises four targets
# (linux-x86_64, linux-aarch64, macos-x86_64, macos-aarch64), but until this
# workflow existed only linux-x86_64 was ever uploaded — by hand. A `curl | sh`
# on an Apple Silicon Mac or an ARM Linux box failed at the download step, which
# is the one platform class the installer most needed to work for.
#
# Tag-driven and fail-closed: pushing a `v*` tag builds all four targets, and the
# release is only created if every matrix leg succeeded. A partial release is
# worse than none, because the installer's fallback message ("check MW_REPO and
# MW_VERSION") sends people to debug the wrong thing.
name: release

on:
  push:
    tags: ['v*']
  # Allows a dry run from main without publishing.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build assets for (publishes nothing)'
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      # Do not let one leg's failure produce a half-published release.
      fail-fast: false
      matrix:
        include:
          - target: linux-x86_64
            os: ubuntu-latest
          - target: linux-aarch64
            os: ubuntu-24.04-arm
          - target: macos-x86_64
            os: macos-13
          - target: macos-aarch64
            os: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (minimal profile, pinned toolchain)
        run: |
          rustup show active-toolchain >/dev/null 2>&1 || rustup toolchain install stable
          rustup default stable
          rustup component add rustfmt clippy

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Verify it actually builds and passes tests before shipping it
        run: |
          cargo test --locked
          cargo clippy --all-targets --all-features --locked -- -D warnings

      - name: Build the release binary
        run: cargo build --release --locked

      # The installer extracts a single member named `memory-wire`:
      #   tar -xzf asset.tar.gz -C "$TMP" "$BIN"
      # so the archive must contain that path at its root, not target/release/….
      - name: Package
        run: |
          mkdir -p dist
          cp target/release/memory-wire "dist/memory-wire"
          strip "dist/memory-wire" || true
          tar -czf "dist/memory-wire-${{ matrix.target }}.tar.gz" -C dist memory-wire
          # Ship the checksum next to the asset so a user can verify the download.
          (cd dist && shasum -a 256 "memory-wire-${{ matrix.target }}.tar.gz" > "memory-wire-${{ matrix.target }}.tar.gz.sha256")
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: memory-wire-${{ matrix.target }}
          path: |
            dist/memory-wire-${{ matrix.target }}.tar.gz
            dist/memory-wire-${{ matrix.target }}.tar.gz.sha256
          if-no-files-found: error

  publish:
    name: publish release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Fail loudly if a target is missing rather than shipping a partial release
        run: |
          missing=""
          for t in linux-x86_64 linux-aarch64 macos-x86_64 macos-aarch64; do
            [ -f "dist/memory-wire-$t.tar.gz" ] || missing="$missing $t"
          done
          if [ -n "$missing" ]; then
            echo "::error::missing release assets for:$missing"
            exit 1
          fi
          ls -l dist

      - name: Create the GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/memory-wire-*.tar.gz
            dist/memory-wire-*.tar.gz.sha256
          generate_release_notes: true
          body: |
            Agent memory in one binary. Install:

            ```bash
            curl -fsSL https://raw.githubusercontent.com/ishan-parihar/memory-wire/main/install/get-memory-wire.sh | sh
            ```

            Then wire it into your agent host and start the server:

            ```bash
            memory-wire connect          # hooks + MCP for every detected host
            memory-wire daemon start     # backgrounded server on 127.0.0.1:8888
            memory-wire doctor           # verify endpoint, store, and health
            ```

            Verify a download with the shipped checksum:

            ```bash
            shasum -a 256 -c memory-wire-<target>.tar.gz.sha256
            ```
